name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gut:
    runs-on: ubuntu-latest
    # A normal run takes a few minutes; a hung engine must not hold the runner for hours.
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0 (Node.js 24)

      # The checksum is copied from the release's official SHA512-SUMS.txt; update both together.
      - name: Install Godot
        env:
          GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "$GODOT_SHA512  godot.zip" | sha512sum --check --strict -
          unzip -q godot.zip
          echo "GODOT=$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      # A fresh checkout has no .godot cache: import once so class names and resources resolve.
      - name: Import project
        run: '"$GODOT" --headless --path . --import'

      - name: Run tests
        run: '"$GODOT" --headless --path . -s addons/gut/gut_cmdln.gd'
